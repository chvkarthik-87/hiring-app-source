
apiVersion: apps/v1
kind: Deployment

metadata:
  name: hiring-app
  namespace: default

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hiring-app

  template:
    metadata:
      labels:
        app: hiring-app

    spec:
      containers:
        - name: hiring-app
          image: chvkarthik/hiring-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP
